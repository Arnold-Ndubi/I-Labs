# Install once per clone:  pip install pre-commit && pre-commit install
repos:
  # Notebook outputs can embed fingerprint images as base64 — strip them.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-biometric-data
        name: block biometric data (images, templates, data/)
        entry: python scripts/check_no_biometrics.py
        language: system
        pass_filenames: true
